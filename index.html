<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Simulasi Register CPU — Kelompok 3</title>
<style>
  :root{
    --cream:#FBF9F1;
    --grid:#EAE6D8;
    --ink:#2B2952;
    --yellow:#F5C242;
    --olive:#C7CE3D;
    --coral:#EF6C4D;
    --white:#FFFFFF;
    --shadow-off: 4px 4px 0 var(--ink);
    --shadow-off-sm: 3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--cream);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:32px 32px;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:20px 16px 40px;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{text-align:center;margin-bottom:18px;}
  h1{
    font-size:clamp(22px,4vw,34px);
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--yellow);
    -webkit-text-stroke:2px var(--ink);
    text-stroke:2px var(--ink);
    margin:0 0 6px;
  }
  .tag{
    display:inline-block;
    background:var(--coral);
    color:var(--white);
    font-weight:800;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:4px 14px;
    border:3px solid var(--ink);
    border-radius:20px;
    box-shadow:var(--shadow-off-sm);
  }

  .tabs{display:flex;gap:10px;justify-content:center;margin:20px 0 22px;flex-wrap:wrap;}
  .tab-btn{
    font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.3px;
    text-transform:uppercase;
    padding:10px 18px;
    background:var(--white);
    color:var(--ink);
    border:3px solid var(--ink);
    border-radius:24px;
    box-shadow:var(--shadow-off-sm);
    cursor:pointer;
    transition:transform .1s;
  }
  .tab-btn:hover{transform:translate(1px,1px);}
  .tab-btn.active{background:var(--olive);}
  .tab-btn:active{box-shadow:none;transform:translate(3px,3px);}

  .stage{
    position:relative;
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow:var(--shadow-off);
    padding:22px 18px 18px;
    margin-bottom:16px;
    overflow:hidden;
  }

  .rack-label{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);opacity:.55;margin-bottom:8px;}

  .rack{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin-bottom:14px;position:relative;z-index:2;
  }
  .reg-box{
    min-width:78px;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:10px;
    box-shadow:var(--shadow-off-sm);
    padding:8px 6px;
    text-align:center;
    transition:box-shadow .2s, transform .2s, background .2s;
  }
  .reg-box .name{font-size:12px;font-weight:900;letter-spacing:.5px;}
  .reg-box .val{
    font-size:15px;font-weight:800;margin-top:4px;
    min-height:20px;word-break:break-all;
    font-family:'Courier New',monospace;
  }
  .reg-box.pulse{
    background:var(--yellow);
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 var(--ink);
  }

  .bus-line{
    height:3px;background:var(--ink);
    margin:0 24px 18px;
    position:relative;
    opacity:.35;
  }
  .bus-line::before,.bus-line::after{
    content:'';position:absolute;top:-4px;width:0;height:0;
    border-top:5px solid transparent;border-bottom:5px solid transparent;
  }

  .mem-title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);opacity:.55;margin-bottom:8px;}
  .mem-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    position:relative;z-index:2;
  }
  .mem-cell{
    background:var(--cream);
    border:2.5px solid var(--ink);
    border-radius:8px;
    padding:6px 4px;
    text-align:center;
    transition:background .2s, transform .2s, box-shadow .2s;
  }
  .mem-cell .addr{font-size:10px;font-weight:800;opacity:.6;}
  .mem-cell .content{
    font-size:12px;font-weight:800;margin-top:3px;min-height:16px;
    font-family:'Courier New',monospace;
    overflow-wrap:anywhere;
  }
  .mem-cell.hot{
    background:var(--coral);color:var(--white);
    transform:translate(-1px,-1px);
    box-shadow:5px 5px 0 var(--ink);
  }
  .mem-cell.hot .addr{opacity:.9;}

  .token{
    position:absolute;
    z-index:10;
    background:var(--ink);
    color:var(--white);
    font-weight:800;
    font-size:11px;
    font-family:'Courier New',monospace;
    padding:4px 9px;
    border-radius:14px;
    border:2px solid var(--white);
    box-shadow:0 3px 8px rgba(0,0,0,.35);
    pointer-events:none;
    opacity:0;
    transition:top .65s cubic-bezier(.4,0,.2,1), left .65s cubic-bezier(.4,0,.2,1), opacity .2s;
    white-space:nowrap;
  }
  .token.show{opacity:1;}

  .info-panel{
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow:var(--shadow-off);
    padding:16px 18px;
    margin-bottom:16px;
  }
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .badge{
    font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
    padding:6px 12px;border-radius:14px;border:2.5px solid var(--ink);
  }
  .badge.phase-fetch{background:var(--olive);}
  .badge.phase-decode{background:var(--yellow);}
  .badge.phase-execute{background:var(--coral);color:var(--white);}
  .badge.instr{background:var(--ink);color:var(--white);}
  .badge.step-count{background:var(--white);}

  .desc{
    font-size:15px;line-height:1.55;min-height:64px;
    font-weight:500;
  }
  .desc b{font-weight:800;}

  .controls{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    justify-content:space-between;
  }
  .nav-btns{display:flex;gap:8px;align-items:center;}
  .btn{
    font-family:inherit;font-weight:800;font-size:13px;
    padding:9px 16px;border:3px solid var(--ink);border-radius:20px;
    background:var(--white);cursor:pointer;box-shadow:var(--shadow-off-sm);
    transition:transform .1s;
  }
  .btn:hover:not(:disabled){transform:translate(1px,1px);}
  .btn:active:not(:disabled){box-shadow:none;transform:translate(3px,3px);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:var(--coral);color:var(--white);}
  .btn.play{background:var(--olive);}

  .jumps{display:flex;gap:6px;}
  .jump-pill{
    font-family:inherit;font-weight:800;font-size:11px;
    padding:6px 11px;border:2.5px solid var(--ink);border-radius:14px;
    background:var(--cream);cursor:pointer;
  }
  .jump-pill.active{background:var(--yellow);}

  .progress-wrap{margin-top:14px;}
  .progress-bar{
    height:10px;background:var(--cream);border:2.5px solid var(--ink);
    border-radius:8px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--olive);
    transition:width .3s;
  }
  .progress-label{font-size:11px;font-weight:700;opacity:.6;margin-top:5px;text-align:right;}

  footer{text-align:center;font-size:12px;opacity:.5;margin-top:20px;font-weight:600;}

  @media (max-width:600px){
    .mem-grid{grid-template-columns:repeat(3,1fr);}
    .reg-box{min-width:64px;padding:6px 4px;}
    .reg-box .val{font-size:12px;}
    .controls{flex-direction:column;align-items:stretch;}
    .nav-btns{justify-content:center;}
    .jumps{justify-content:center;}
  }
  @media (prefers-reduced-motion: reduce){
    .token,.reg-box,.mem-cell{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Register pada CPU</h1>
    <span class="tag">Simulasi Siklus Instruksi — Kelompok 3</span>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-case="1">Studi Kasus 1 — Kalkulator 5 + 3</button>
    <button class="tab-btn" data-case="2">Studi Kasus 2 — Saldo Rekening</button>
  </div>

  <div class="stage" id="stage">
    <div class="rack-label">CPU — Register</div>
    <div class="rack" id="rack">
      <div class="reg-box" id="reg-PC"><div class="name">PC</div><div class="val">100</div></div>
      <div class="reg-box" id="reg-MAR"><div class="name">MAR</div><div class="val">—</div></div>
      <div class="reg-box" id="reg-MDR"><div class="name">MDR</div><div class="val">—</div></div>
      <div class="reg-box" id="reg-IR"><div class="name">IR</div><div class="val">—</div></div>
      <div class="reg-box" id="reg-AC"><div class="name">AC</div><div class="val">—</div></div>
    </div>
    <div class="bus-line"></div>
    <div class="mem-title">Memori Utama</div>
    <div class="mem-grid" id="mem-grid"></div>

    <div class="token" id="token">data</div>
  </div>

  <div class="info-panel">
    <div class="badges">
      <span class="badge phase-fetch" id="badge-phase">FETCH</span>
      <span class="badge instr" id="badge-instr">Instruksi 1/3</span>
      <span class="badge step-count" id="badge-step">Langkah 1/21</span>
    </div>
    <div class="desc" id="desc">Memuat...</div>

    <div class="controls">
      <div class="nav-btns">
        <button class="btn" id="btn-prev">◀ Sebelumnya</button>
        <button class="btn play" id="btn-play">▶ Putar Otomatis</button>
        <button class="btn primary" id="btn-next">Selanjutnya ▶</button>
      </div>
      <div class="jumps" id="jumps">
        <button class="jump-pill" data-instr="1">Instruksi 1</button>
        <button class="jump-pill" data-instr="2">Instruksi 2</button>
        <button class="jump-pill" data-instr="3">Instruksi 3</button>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">Langkah 1 dari 21</div>
    </div>
  </div>

  <footer>Gunakan tombol ← → di keyboard untuk maju/mundur • Simulasi disusun berdasarkan model accumulator-based (Mano)</footer>
</div>

<script>
(function(){

  function generateSteps(cfg){
    const {opWord, opSymbol, opVerb, a, b, result, addrA, addrB, addrR} = cfg;
    return [
      // Instruksi 1: LOAD addrA
      {instr:1, phase:'FETCH', desc:`<b>PC</b> menunjuk ke alamat instruksi pertama (100). Nilai PC dikirim ke <b>MAR</b>.`, transfer:{from:'PC',to:'MAR',label:'100'}, regDiff:{MAR:'100'}},
      {instr:1, phase:'FETCH', desc:`CPU mengakses memori alamat 100. Instruksi <b>"LOAD ${addrA}"</b> diambil dan masuk ke <b>MDR</b>.`, transfer:{from:'MEM',to:'MDR',label:`LOAD ${addrA}`}, memHighlight:'100', regDiff:{MDR:`LOAD ${addrA}`}},
      {instr:1, phase:'FETCH', desc:`Isi <b>MDR</b> dipindahkan ke <b>IR</b> untuk diproses.`, transfer:{from:'MDR',to:'IR',label:`LOAD ${addrA}`}, regDiff:{IR:`LOAD ${addrA}`}},
      {instr:1, phase:'FETCH', desc:`<b>PC</b> bertambah 1 menjadi 101 — siap menunjuk ke instruksi berikutnya.`, transfer:null, regDiff:{PC:'101'}},
      {instr:1, phase:'DECODE', desc:`Control Unit membaca <b>IR</b>: "ambil data dari alamat ${addrA}, taruh di Accumulator".`, transfer:null, regDiff:{}},
      {instr:1, phase:'EXECUTE', desc:`Alamat operand (${addrA}) dikirim ke <b>MAR</b>.`, transfer:{from:'IR',to:'MAR',label:String(addrA)}, regDiff:{MAR:String(addrA)}},
      {instr:1, phase:'EXECUTE', desc:`CPU mengakses memori alamat ${addrA}. Nilai (${a}) diambil ke <b>MDR</b>.`, transfer:{from:'MEM',to:'MDR',label:String(a)}, memHighlight:String(addrA), regDiff:{MDR:String(a)}},
      {instr:1, phase:'EXECUTE', desc:`Nilai di <b>MDR</b> disalin ke <b>Accumulator</b>. AC = ${a}.`, transfer:{from:'MDR',to:'AC',label:String(a)}, regDiff:{AC:String(a)}},

      // Instruksi 2: opWord addrB
      {instr:2, phase:'FETCH', desc:`<b>PC</b> (101) dikirim ke <b>MAR</b>.`, transfer:{from:'PC',to:'MAR',label:'101'}, regDiff:{MAR:'101'}},
      {instr:2, phase:'FETCH', desc:`Instruksi <b>"${opWord} ${addrB}"</b> diambil dari memori, masuk ke <b>MDR</b>.`, transfer:{from:'MEM',to:'MDR',label:`${opWord} ${addrB}`}, memHighlight:'101', regDiff:{MDR:`${opWord} ${addrB}`}},
      {instr:2, phase:'FETCH', desc:`Isi <b>MDR</b> dipindah ke <b>IR</b>, lalu <b>PC</b> bertambah menjadi 102.`, transfer:{from:'MDR',to:'IR',label:`${opWord} ${addrB}`}, regDiff:{IR:`${opWord} ${addrB}`, PC:'102'}},
      {instr:2, phase:'DECODE', desc:`Control Unit membaca <b>IR</b>: "${opVerb} isi Accumulator dengan nilai pada alamat ${addrB}".`, transfer:null, regDiff:{}},
      {instr:2, phase:'EXECUTE', desc:`Alamat operand (${addrB}) dikirim ke <b>MAR</b>.`, transfer:{from:'IR',to:'MAR',label:String(addrB)}, regDiff:{MAR:String(addrB)}},
      {instr:2, phase:'EXECUTE', desc:`Nilai di alamat ${addrB} (${b}) diambil ke <b>MDR</b>.`, transfer:{from:'MEM',to:'MDR',label:String(b)}, memHighlight:String(addrB), regDiff:{MDR:String(b)}},
      {instr:2, phase:'EXECUTE', desc:`<b>ALU</b> meng${opWord==='ADD'?'jumlah':'urang'}kan AC (${a}) ${opSymbol} MDR (${b}) → hasil disimpan lagi ke <b>AC = ${result}</b>.`, transfer:{from:'MDR',to:'AC',label:`${opSymbol}${b}`}, regDiff:{AC:String(result)}},

      // Instruksi 3: STORE addrR
      {instr:3, phase:'FETCH', desc:`<b>PC</b> (102) dikirim ke <b>MAR</b>.`, transfer:{from:'PC',to:'MAR',label:'102'}, regDiff:{MAR:'102'}},
      {instr:3, phase:'FETCH', desc:`Instruksi <b>"STORE ${addrR}"</b> diambil dari memori, masuk ke <b>IR</b>. PC bertambah menjadi 103.`, transfer:{from:'MEM',to:'IR',label:`STORE ${addrR}`}, memHighlight:'102', regDiff:{IR:`STORE ${addrR}`, PC:'103'}},
      {instr:3, phase:'DECODE', desc:`Control Unit membaca <b>IR</b>: "simpan isi Accumulator ke alamat ${addrR}".`, transfer:null, regDiff:{}},
      {instr:3, phase:'EXECUTE', desc:`Alamat tujuan (${addrR}) dikirim ke <b>MAR</b>.`, transfer:{from:'IR',to:'MAR',label:String(addrR)}, regDiff:{MAR:String(addrR)}},
      {instr:3, phase:'EXECUTE', desc:`Isi <b>Accumulator</b> (${result}) dikirim ke <b>MDR</b>.`, transfer:{from:'AC',to:'MDR',label:String(result)}, regDiff:{MDR:String(result)}},
      {instr:3, phase:'EXECUTE', desc:`Nilai <b>MDR</b> (${result}) dituliskan ke memori alamat ${addrR}. 🎉 Hasil akhir berhasil disimpan!`, transfer:{from:'MDR',to:'MEM',label:String(result)}, memHighlight:String(addrR), memWrite:{addr:String(addrR), value:String(result)}, regDiff:{}}
    ];
  }

  const MEM_ORDER = ['100','101','102','300','301','302'];

  const CASES = {
    1:{
      title:'Kalkulator: 5 + 3',
      memInit:{'100':'LOAD 300','101':'ADD 301','102':'STORE 302','300':'5','301':'3','302':''},
      cfg:{opWord:'ADD', opSymbol:'+', opVerb:'tambahkan', a:'5', b:'3', result:'8', addrA:300, addrB:301, addrR:302}
    },
    2:{
      title:'Transaksi Saldo Rekening (Rp50.000 − Rp15.000)',
      memInit:{'100':'LOAD 300','101':'SUB 301','102':'STORE 302','300':'50.000','301':'15.000','302':''},
      cfg:{opWord:'SUB', opSymbol:'−', opVerb:'kurangi', a:'50.000', b:'15.000', result:'35.000', addrA:300, addrB:301, addrR:302}
    }
  };

  let currentCase = 1;
  let steps = generateSteps(CASES[1].cfg);
  let stepIdx = 0;
  let playTimer = null;

  const regBoxes = {
    PC: document.getElementById('reg-PC'),
    MAR: document.getElementById('reg-MAR'),
    MDR: document.getElementById('reg-MDR'),
    IR: document.getElementById('reg-IR'),
    AC: document.getElementById('reg-AC')
  };
  const memGrid = document.getElementById('mem-grid');
  const stage = document.getElementById('stage');
  const token = document.getElementById('token');
  const descEl = document.getElementById('desc');
  const badgePhase = document.getElementById('badge-phase');
  const badgeInstr = document.getElementById('badge-instr');
  const badgeStep = document.getElementById('badge-step');
  const progressFill = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnPlay = document.getElementById('btn-play');

  function buildMemGrid(){
    memGrid.innerHTML = '';
    MEM_ORDER.forEach(addr=>{
      const cell = document.createElement('div');
      cell.className = 'mem-cell';
      cell.dataset.addr = addr;
      cell.innerHTML = `<div class="addr">${addr}</div><div class="content"></div>`;
      memGrid.appendChild(cell);
    });
  }

  function computeState(upToIdx){
    const regs = {PC:'100', MAR:'—', MDR:'—', IR:'—', AC:'—'};
    const mem = Object.assign({}, CASES[currentCase].memInit);
    for(let i=0;i<=upToIdx;i++){
      const s = steps[i];
      Object.assign(regs, s.regDiff || {});
      if(s.memWrite){ mem[s.memWrite.addr] = s.memWrite.value; }
    }
    return {regs, mem};
  }

  function render(animate){
    const step = steps[stepIdx];
    const {regs, mem} = computeState(stepIdx);

    // registers
    Object.keys(regBoxes).forEach(k=>{
      regBoxes[k].querySelector('.val').textContent = regs[k] === '' ? '—' : regs[k];
      regBoxes[k].classList.remove('pulse');
    });

    // memory
    MEM_ORDER.forEach(addr=>{
      const cell = memGrid.querySelector(`[data-addr="${addr}"]`);
      const val = mem[addr];
      cell.querySelector('.content').textContent = (val === '' || val === undefined) ? '(kosong)' : val;
      cell.classList.remove('hot');
    });
    if(step.memHighlight){
      const hotCell = memGrid.querySelector(`[data-addr="${step.memHighlight}"]`);
      if(hotCell) hotCell.classList.add('hot');
    }

    // badges
    badgePhase.textContent = step.phase;
    badgePhase.className = 'badge ' + (step.phase==='FETCH' ? 'phase-fetch' : step.phase==='DECODE' ? 'phase-decode' : 'phase-execute');
    badgeInstr.textContent = `Instruksi ${step.instr}/3`;
    badgeStep.textContent = `Langkah ${stepIdx+1}/${steps.length}`;

    descEl.innerHTML = step.desc;

    progressFill.style.width = `${((stepIdx+1)/steps.length)*100}%`;
    progressLabel.textContent = `Langkah ${stepIdx+1} dari ${steps.length}`;

    btnPrev.disabled = stepIdx===0;
    btnNext.disabled = stepIdx===steps.length-1;

    updateJumpPills(step.instr);

    if(animate && step.transfer){
      requestAnimationFrame(()=> animateTransfer(step.transfer, step));
    } else {
      token.classList.remove('show');
    }
  }

  function getAnchorRect(key, memAddr){
    let el;
    if(key === 'MEM'){
      el = memGrid.querySelector(`[data-addr="${memAddr}"]`);
    } else {
      el = regBoxes[key];
    }
    if(!el) return null;
    const stageRect = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return {
      x: r.left - stageRect.left + r.width/2,
      y: r.top - stageRect.top + r.height/2,
      el
    };
  }

  function animateTransfer(transfer, step){
    const fromAnchor = getAnchorRect(transfer.from, step.memHighlight);
    const toAnchor = getAnchorRect(transfer.to, step.memHighlight);
    if(!fromAnchor || !toAnchor) return;

    token.textContent = transfer.label;
    token.style.left = fromAnchor.x + 'px';
    token.style.top = fromAnchor.y + 'px';
    token.classList.remove('show');
    token.style.transition = 'none';
    // force reflow
    void token.offsetWidth;
    token.style.transition = '';
    token.classList.add('show');

    if(fromAnchor.el && fromAnchor.el.classList.contains('reg-box')) fromAnchor.el.classList.add('pulse');
    if(fromAnchor.el && fromAnchor.el.classList.contains('mem-cell')) fromAnchor.el.classList.add('hot');

    requestAnimationFrame(()=>{
      token.style.left = toAnchor.x + 'px';
      token.style.top = toAnchor.y + 'px';
    });

    setTimeout(()=>{
      if(toAnchor.el && toAnchor.el.classList.contains('reg-box')) toAnchor.el.classList.add('pulse');
      token.classList.remove('show');
    }, 650);
  }

  function updateJumpPills(activeInstr){
    document.querySelectorAll('.jump-pill').forEach(p=>{
      p.classList.toggle('active', parseInt(p.dataset.instr,10) === activeInstr);
    });
  }

  function goTo(idx, animate){
    stepIdx = Math.max(0, Math.min(steps.length-1, idx));
    render(animate !== false);
  }

  function next(){ if(stepIdx < steps.length-1) goTo(stepIdx+1, true); else stopPlay(); }
  function prev(){ if(stepIdx > 0) goTo(stepIdx-1, true); }

  function startPlay(){
    if(playTimer) return;
    btnPlay.textContent = '⏸ Jeda';
    btnPlay.classList.remove('play');
    btnPlay.style.background = 'var(--yellow)';
    playTimer = setInterval(()=>{
      if(stepIdx >= steps.length-1){ stopPlay(); return; }
      next();
    }, 2400);
  }
  function stopPlay(){
    clearInterval(playTimer);
    playTimer = null;
    btnPlay.textContent = '▶ Putar Otomatis';
    btnPlay.classList.add('play');
    btnPlay.style.background = '';
  }
  function togglePlay(){ playTimer ? stopPlay() : startPlay(); }

  function switchCase(caseNum){
    stopPlay();
    currentCase = caseNum;
    steps = generateSteps(CASES[caseNum].cfg);
    stepIdx = 0;
    buildMemGrid();
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', parseInt(b.dataset.case,10)===caseNum));
    render(false);
  }

  // event bindings
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=> switchCase(parseInt(b.dataset.case,10)));
  });
  btnNext.addEventListener('click', ()=>{ stopPlay(); next(); });
  btnPrev.addEventListener('click', ()=>{ stopPlay(); prev(); });
  btnPlay.addEventListener('click', togglePlay);
  document.querySelectorAll('.jump-pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      stopPlay();
      const instrNum = parseInt(p.dataset.instr,10);
      const idx = steps.findIndex(s=>s.instr===instrNum);
      goTo(idx, false);
    });
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight'){ stopPlay(); next(); }
    if(e.key === 'ArrowLeft'){ stopPlay(); prev(); }
    if(e.key === ' '){ e.preventDefault(); togglePlay(); }
  });

  // init
  buildMemGrid();
  render(false);

})();
</script>
</body>
</html>
